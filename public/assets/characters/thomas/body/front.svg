<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D4F6F"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
  </defs>

  <!-- Neck -->
  <rect x="88" y="5" width="24" height="25" fill="#F5C5A3" rx="8"/>

  <!-- T-shirt body -->
  <path d="M65 30 Q72 25 100 23 Q128 25 135 30 L142 180 Q100 185 58 180 Z" fill="url(#shirt)"/>
  <!-- Collar -->
  <path d="M82 28 Q100 35 118 28" stroke="#357ABD" stroke-width="3" fill="none"/>
  <!-- Shirt wrinkles -->
  <path d="M85 80 Q95 85 90 120" stroke="#3570A8" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M115 90 Q108 100 112 130" stroke="#3570A8" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Belt -->
  <rect x="62" y="178" width="76" height="10" fill="#5C3A1E" rx="2"/>
  <rect x="95" y="179" width="10" height="8" fill="#B8860B" rx="1"/>

  <!-- Pants -->
  <path d="M65 188 L58 370 Q75 375 100 372 L100 188" fill="url(#pants)"/>
  <path d="M135 188 L142 370 Q125 375 100 372 L100 188" fill="url(#pants)"/>
  <!-- Pants crease -->
  <line x1="80" y1="200" x2="78" y2="360" stroke="#253545" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="200" x2="122" y2="360" stroke="#253545" stroke-width="1" opacity="0.4"/>

  <!-- Shoes -->
  <path d="M45 368 Q55 362 75 365 Q80 375 75 382 Q55 385 45 380 Z" fill="#4A3728"/>
  <path d="M125 365 Q145 362 155 368 Q157 380 155 382 Q145 385 125 382 Z" fill="#4A3728"/>
  <!-- Shoe detail -->
  <path d="M50 374 Q62 372 72 374" stroke="#3D2E1E" stroke-width="1" fill="none"/>
  <path d="M128 374 Q140 372 152 374" stroke="#3D2E1E" stroke-width="1" fill="none"/>
</svg>
