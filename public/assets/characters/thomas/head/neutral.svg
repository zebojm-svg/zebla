<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <defs>
    <radialGradient id="skin" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#F5C5A3"/>
    </radialGradient>
  </defs>

  <!-- Head shape -->
  <ellipse cx="60" cy="78" rx="44" ry="50" fill="url(#skin)"/>

  <!-- Ears -->
  <ellipse cx="17" cy="80" rx="8" ry="13" fill="#F5C5A3"/>
  <ellipse cx="17" cy="80" rx="5" ry="9" fill="#EAAE8A" opacity="0.5"/>
  <ellipse cx="103" cy="80" rx="8" ry="13" fill="#F5C5A3"/>
  <ellipse cx="103" cy="80" rx="5" ry="9" fill="#EAAE8A" opacity="0.5"/>

  <!-- Hair -->
  <path d="M18 65 Q20 20 60 18 Q100 20 102 65 Q98 40 60 38 Q22 40 18 65" fill="#5D3A1A"/>
  <!-- Hair volume -->
  <path d="M25 55 Q30 30 60 28 Q90 30 95 55" fill="#6B4520" opacity="0.6"/>
  <!-- Hair strand -->
  <path d="M50 20 Q55 15 58 22" fill="#5D3A1A"/>

  <!-- Eyebrows -->
  <path d="M35 62 Q44 57 53 62" stroke="#4A2F12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M67 62 Q76 57 85 62" stroke="#4A2F12" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="44" cy="74" rx="9" ry="10" fill="white"/>
  <ellipse cx="76" cy="74" rx="9" ry="10" fill="white"/>
  <circle cx="45" cy="75" r="5" fill="#4A3728"/>
  <circle cx="75" cy="75" r="5" fill="#4A3728"/>
  <circle cx="46" cy="73" r="2" fill="white"/>
  <circle cx="76" cy="73" r="2" fill="white"/>
  <!-- Eyelids subtle -->
  <path d="M35 68 Q44 65 53 68" stroke="#DBA88A" stroke-width="1" fill="none"/>
  <path d="M67 68 Q76 65 85 68" stroke="#DBA88A" stroke-width="1" fill="none"/>

  <!-- Nose -->
  <path d="M57 82 Q60 92 63 82" stroke="#DBA88A" stroke-width="1.8" fill="none"/>
  <circle cx="56" cy="88" r="2.5" fill="#EAAE8A" opacity="0.6"/>
  <circle cx="64" cy="88" r="2.5" fill="#EAAE8A" opacity="0.6"/>

  <!-- Mouth (neutral, slight smile) -->
  <path d="M48 103 Q60 108 72 103" stroke="#C0392B" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Cheeks (blush) -->
  <ellipse cx="35" cy="92" rx="8" ry="5" fill="#F5A5A5" opacity="0.25"/>
  <ellipse cx="85" cy="92" rx="8" ry="5" fill="#F5A5A5" opacity="0.25"/>
</svg>
